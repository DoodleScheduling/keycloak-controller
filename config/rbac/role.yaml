---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - secrets
  verbs:
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - keycloak.infra.doodle.com
  resources:
  - keycloakclients
  - keycloakrealms
  - keycloakusers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - keycloak.infra.doodle.com
  resources:
  - keycloakclients/status
  - keycloakrealms/status
  - keycloakusers/status
  verbs:
  - get
  - patch
  - update
